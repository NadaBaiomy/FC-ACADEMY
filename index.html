<style>
:root{--bg:#0D0618;--bg2:#1A0F2E;--card:#2D1B4E;--ac:#00E676;--ac2:#00C853;--pr:#7C4DFF;--pr2:#B388FF;--gd:#FFD740;--rd:#FF5252;--or:#FF9100;--tx:#fff;--mt:#9E8FBF;--bd:rgba(0,230,118,.2);--gl:rgba(45,27,78,.6)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--tx);height:100%;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(124,77,255,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(0,230,118,.06) 0%,transparent 50%);pointer-events:none;z-index:0}
.fl{position:fixed;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 48px,rgba(0,230,118,.03) 48px,rgba(0,230,118,.03) 50px),repeating-linear-gradient(0deg,transparent,transparent 48px,rgba(0,230,118,.03) 48px,rgba(0,230,118,.03) 50px);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--ac);border-radius:3px}
@keyframes bb{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-35px) rotate(180deg)}}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes pl{0%,100%{opacity:.3;transform:scaleX(.5)}50%{opacity:1;transform:scaleX(1)}}
@keyframes fi{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes cs{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes tin{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes su{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.sn{display:none;position:fixed;inset:0;z-index:1;flex-direction:column;overflow:hidden}
.sn.on{display:flex;animation:su .3s ease}
#LS{align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.lbox{background:var(--gl);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:20px;padding:36px;width:100%;max-width:420px;box-shadow:0 0 30px rgba(0,230,118,.15);animation:fi .5s ease}
.ll{font-family:'Orbitron';font-size:1.7rem;font-weight:900;text-align:center;background:linear-gradient(135deg,var(--ac),var(--pr2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:26px}
.lts{display:flex;gap:6px;margin-bottom:22px}
.lt{flex:1;padding:10px;border:1px solid var(--bd);border-radius:10px;background:0 0;color:var(--mt);font-family:'Tajawal';font-size:.82rem;cursor:pointer;transition:.3s;text-align:center}

.sr{display:flex;align-items:center;gap:5px;margin-bottom:3px}.srl{font-size:.62rem;color:var(--mt);width:40px;flex-shrink:0}

.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);z-index:1000;align-items:center;justify-content:center;padding:18px}.mo.show{display:flex}
.md{background:var(--bg2);border:1px solid var(--bd);border-radius:15px;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;padding:22px;box-shadow:0 0 40px rgba(0,230,118,.1)}

.rc{background:var(--gl);border:1px solid var(--bd);border-radius:11px;padding:14px;margin-bottom:10px}
.rc .rd{font-size:.72rem;color:var(--ac);font-weight:700;margin-bottom:5px}.rc .rt{font-size:.88rem;line-height:1.7}
.rm{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.rm img{width:75px;height:75px;border-radius:7px;object-fit:cover;border:1px solid var(--bd);cursor:pointer}

.rmi{background:var(--card);border-radius:8px;padding:8px 6px;text-align:center;border:1px solid rgba(0,230,118,.08)}

.ibg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:18px}
.ibi{background:var(--card);border-radius:9px;padding:10px;text-align:center}.ibi .v{font-family:'Orbitron';font-size:1rem;font-weight:700;color:var(--ac)}.ibi .lb{font-size:.68rem;color:var(--mt);margin-top:2px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:500px){.fr{grid-template-columns:1fr}}
.fs{margin-bottom:14px;padding:12px;background:var(--card);border-radius:11px;border:1px solid var(--bd)}
.fs h4{font-size:.82rem;color:var(--ac);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.sl{font-size:.95rem;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}.sl i{color:var(--ac)}
.le{display:flex;gap:10px;padding:9px;border-bottom:1px solid rgba(0,230,118,.05);font-size:.8rem}
.let{color:var(--ac);font-family:'Orbitron';font-size:.68rem;white-space:nowrap;min-width:65px}.leu{color:var(--pr2);font-weight:700;min-width:55px}.lea{color:var(--tx);flex:1}.led{color:var(--mt);font-size:.72rem}
.si{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.03);font-size:.8rem}.si .ai{color:var(--ac);font-weight:700}
.stt{padding:10px;background:var(--card);border-radius:7px;margin-top:8px;font-weight:700;display:flex;justify-content:space-between}
.vp{width:55px;height:55px;border:2px dashed var(--bd);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:.3s;vertical-align:middle}.vp:hover{border-color:var(--ac)}.vp i{font-size:.9rem;color:var(--mt)}.vp video{width:100%;height:100%;object-fit:cover}
.rvpre{margin-top:8px}
@media(max-width:600px){.lbox{padding:28px 18px}.sg{grid-template-columns:repeat(2,1fr)}.pcg{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}.tn{gap:3px;padding:7px 8px}.tb{padding:5px 9px;font-size:.68rem}table{font-size:.7rem}th,td{padding:7px 5px}}
</style>
</head>

<script>
var SB_URL='https://casvwtnlvuuaxawrlpah.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhc3Z3dG5sdnV1YXhhd3JscGFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjU5MTAsImV4cCI6MjA5NDAwMTkxMH0.jWQC5RYmoUDTP4kqrpniHsKhkVdVRo6aAc8YZOe3DfE';
var SB=null,_cache={},_ready=false;

function initLocal(){
    if(!_cache['admins']||!_cache['admins'].length){
        _cache={admins:[{id:'admin_def',email:'admin@fc.com',password:'admin123'}],coaches:[],parents:[],players:[],reports:[],expenses:[],revenues:[],logs:[]};
    }
}

function initDB(){
    try{
        if(typeof supabase==='undefined'||!supabase.createClient)throw '';
        SB=supabase.createClient(SB_URL,SB_KEY);
        SB.from('admins').select('id').limit(1).then(function(res){
            _ready=!res.error;
            if(_ready){D.dbLoadAll()}
            else{initLocal()}
            hideSp();
        }).catch(function(){_ready=false;initLocal();hideSp()});
    }catch(e){_ready=false;initLocal();hideSp()}
}

function hideSp(){var s=document.getElementById('sp');if(!s)return;s.style.opacity='0';setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},600)}

var D={
    g:function(k){return _cache[k]||[]},
    s:function(k,v){_cache[k]=v;if(_ready&&SB)this._sync(k,v)},
    _sync:function(k,data){
        SB.from(k).select('id').then(function(res){
            var ex=(res.data||[]).map(function(x){return x.id});
            var nx=data.map(function(x){return x.id});
            var dl=ex.filter(function(id){return nx.indexOf(id)<0});
            var p=data.length?SB.from(k).upsert(data,{onConflict:'id'}):Promise.resolve();
            p.then(function(){if(dl.length>0)SB.from(k).delete().in('id',dl).then()})
        })
    },
    addDoc:function(k,item){
        if(!_cache[k])_cache[k]=[];
        _cache[k]=_cache[k].filter(function(x){return x.id!==item.id});
        _cache[k].push(item);
        if(!_ready||!SB)return Promise.resolve();
        return SB.from(k).upsert(item,{onConflict:'id'})
    },
    delDoc:function(k,id){
        _cache[k]=(_cache[k]||[]).filter(function(x){return x.id!==id});
        if(!_ready||!SB)return Promise.resolve();
        return SB.from(k).delete().eq('id',id)
    },
    load:function(k){
        if(!_ready||!SB)return Promise.resolve(_cache[k]||[]);
        return SB.from(k).select('*').then(function(res){_cache[k]=res.data||[];return _cache[k]}).catch(function(){return _cache[k]||[]})
    },
    dbLoadAll:function(){
        return Promise.all(['admins','coaches','parents','players','reports','expenses','revenues','logs'].map(function(c){return D.load(c)}))
    }
};
